app-id: net.surajyadav.Tokri
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: Tokri
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --device=input
  - --filesystem=home/Tokri:rw
  - --require-version=1.16
modules:
  - name: Tokri
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://www.github.com/jarusll/tokri.git
        commit: 9dc79f11442fdaa1d044bdf940ae40477544f1e8
